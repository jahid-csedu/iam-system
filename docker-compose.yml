services:
  app:
    build: .
    ports:
      - "8080:8080"
    # The dev profile needs every setting; the ones without a value here come from .env, and a missing one stops the
    # app's startup with its name.
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/iam_system_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      IAM_JWT_ISSUER: http://localhost:8080
      IAM_JWT_KEYS_0_KID:
      IAM_JWT_KEYS_0_PRIVATEKEYLOCATION: file:/run/secrets/jwt-signing-key.pem
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      IAM_MAIL_FROM:
      IAM_PLATFORM_ROOT_USERNAME:
      IAM_PLATFORM_ROOT_PASSWORD:
      IAM_PLATFORM_ROOT_EMAIL:
      IAM_PLATFORM_ROOT_FULL_NAME:
      IAM_CORS_ALLOWEDORIGINS:
    # The signing key's PEM file (IAM_JWT_KEY_FILE in .env, default ./jwt-key.pem), mounted read-only; the key never
    # travels in an environment variable.
    secrets:
      - source: jwt_signing_key
        target: jwt-signing-key.pem
    volumes:
      - ./logs:/app/logs # Shared with logstash
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: iam_system_db
    ports:
      - "3366:3306" # Expose to host
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - logging-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: logstash
    command: logstash -f /usr/share/logstash/config/logstash.conf
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logs:/usr/share/logstash/logs # Mount application logs directory
    ports:
      - "5000:5000"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - logging-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      KIBANA_ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - logging-network

secrets:
  jwt_signing_key:
    file: ${IAM_JWT_KEY_FILE:-./jwt-key.pem}

volumes:
  db_data:
  elasticsearch-data:

networks:
  logging-network:
    driver: bridge