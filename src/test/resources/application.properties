spring.datasource.url=jdbc:tc:mysql:8.0:///iam_system_db
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Only the test suite runs without a signing key (a temporary one) and without a platform root (unless a test creates one).
iam.jwt.allow-temporary-key=true
iam.platform.allow-missing-root=true

spring.mail.host=smtp.test.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpassword
password.reset.otp.expiration.minutes=1
password.expiration.days=90

spring.application.version=1.0.0
