<!DOCTYPE html>
<!--/* The shared frame of every HTML email: header, the purpose's content, footer. Used as layout(title, content). */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Email</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
                <tr>
                    <td style="padding:20px 32px;border-bottom:1px solid #e4e7eb;font-size:18px;font-weight:bold;">
                        IAM System
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px;font-size:15px;line-height:1.5;">
                        <div th:replace="${content}">Content</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">
                        This is an automatic message; replies are not read.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
