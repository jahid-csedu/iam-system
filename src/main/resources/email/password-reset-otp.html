<!DOCTYPE html>
<!--/* Values: otp, validMinutes. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Your password reset code</title>
</head>
<body>
<main>
    <p style="margin:0 0 16px;">Use this code to reset your password:</p>
    <p style="margin:0 0 16px;font-size:28px;font-weight:bold;letter-spacing:6px;" th:text="${otp}">123456</p>
    <p style="margin:0 0 16px;">
        It is valid for <span th:text="${validMinutes}">5</span> minutes and works once.
        Never share it: we will never ask you for it.
    </p>
    <p style="margin:0;">If you didn't ask to reset your password, ignore this email; your password stays the same.</p>
</main>
</body>
</html>
