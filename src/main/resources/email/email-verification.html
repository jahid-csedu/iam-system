<!DOCTYPE html>
<!--/* Values: code, validMinutes. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Verify your email address</title>
</head>
<body>
<main>
    <p style="margin:0 0 16px;">Use this code to verify your email address:</p>
    <p style="margin:0 0 16px;font-size:28px;font-weight:bold;letter-spacing:6px;" th:text="${code}">123456</p>
    <p style="margin:0 0 16px;">
        It is valid for <span th:text="${validMinutes}">30</span> minutes and works once.
        Never share it: we will never ask you for it.
    </p>
    <p style="margin:0;">If you didn't ask for it, ignore this email; nothing changes.</p>
</main>
</body>
</html>
