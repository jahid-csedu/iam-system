# The shared development environment (docker compose runs with it).
# Every setting is required (iam.required-settings): the startup stops and names the environment variables
# that are missing or empty.

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Token signing: the public base URL of this IAM (each token's iss is <issuer>/tenants/<id>).
iam.jwt.issuer=${IAM_JWT_ISSUER:}

# Mail account that sends the password-reset OTPs.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Browser origins allowed to call the API from another origin (exact origins, comma-separated), e.g. the management
# console.
iam.cors.allowed-origins=${IAM_CORS_ALLOWEDORIGINS:}
