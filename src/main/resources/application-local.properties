# Local development on your machine (./gradlew bootRun). Every setting is optional here; the defaults fit
# docker compose's MySQL on localhost:3366, and an empty value means "not set".

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3366/iam_system_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Token signing: the public base URL of this IAM (each token's iss is <issuer>/tenants/<id>).
iam.jwt.issuer=${IAM_JWT_ISSUER:http://localhost:8080}

# Mail account that sends the password-reset OTPs (without it, no email goes out).
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Browser origins allowed to call the API from another origin (exact origins, comma-separated), e.g. the management
# console: http://localhost:5173. None when empty.
iam.cors.allowed-origins=${IAM_CORS_ALLOWEDORIGINS:}
