# Staging.
# Every setting is required (iam.required-settings): the startup stops and names the environment variables
# that are missing or empty. The signing key needs its PEM inline or a location; the platform root is needed until the
# platform has its root user (then IAM_PLATFORM_ROOT_PASSWORD can go).

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Token signing: the public base URL of this IAM (each token's iss is <issuer>/tenants/<id>).
iam.jwt.issuer=${IAM_JWT_ISSUER:}

# Token signing key (the first key signs; IAM_JWT_KEYS_1_* etc. add older keys while rotating): an id plus a PKCS#8 RSA
# private key, either inline (base64, PEM header lines optional) or read from a file (file:/path/jwt-key.pem).
iam.jwt.keys[0].kid=${IAM_JWT_KEYS_0_KID:}
iam.jwt.keys[0].private-key=${IAM_JWT_KEYS_0_PRIVATEKEY:}
iam.jwt.keys[0].private-key-location=${IAM_JWT_KEYS_0_PRIVATEKEYLOCATION:}

# The first super user (the platform root), created at startup while the platform has no root and read only then.
iam.platform.root.username=${IAM_PLATFORM_ROOT_USERNAME:}
iam.platform.root.password=${IAM_PLATFORM_ROOT_PASSWORD:}
iam.platform.root.email=${IAM_PLATFORM_ROOT_EMAIL:}
iam.platform.root.full-name=${IAM_PLATFORM_ROOT_FULL_NAME:}

# Mail account that sends the password-reset OTPs.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Browser origins allowed to call the API from another origin (exact origins, comma-separated), e.g. the management
# console.
iam.cors.allowed-origins=${IAM_CORS_ALLOWEDORIGINS:}
