spring.application.name=IAM System Application
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3366/iam_system_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO

security.max-failed-attempts=5
security.lockout-duration-minutes=15

password.reset.otp.expiration.minutes=5
password.expiration.days=90

# Token signing: the public base URL (each token's iss is <issuer>/tenants/<id>) and the RSA keys (iam.jwt.keys[n].kid,
# iam.jwt.keys[n].private-key). Without keys a temporary key is generated at startup.
iam.jwt.issuer=http://localhost:8080

# Browser origins allowed to call the API from another origin (exact origins, comma-separated), e.g. the management
# console: iam.cors.allowed-origins=http://localhost:5173,https://console.example.com. None by default.

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Give up on an unresponsive mail server after 10 s (JavaMail waits forever by default), so a request that sends
# an email never hangs.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.application.version=1.0.0