spring.application.name=IAM System Application
spring.application.version=1.0.0

# Every run has exactly one environment profile: local, dev, stage or prod (SPRING_PROFILES_ACTIVE; ./gradlew bootRun
# uses local unless .env says otherwise). Its file (application-<profile>.properties) lists the environment's settings
# and the environment variables they come from. Every setting below must have a value, or the startup stops and names
# the missing ones (EnvironmentProfileCheck); the signing key's PEM (SigningKeys) and, until it exists, the platform root
# (PlatformBootstrap) are checked where they're used. Only the test suite relaxes this (its own application.properties).
iam.required-settings=spring.datasource.url,spring.datasource.username,spring.datasource.password,\
  iam.jwt.issuer,iam.jwt.keys[0].kid,spring.mail.username,spring.mail.password,iam.cors.allowed-origins

server.port=${SERVER_PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO

security.max-failed-attempts=5
security.lockout-duration-minutes=15

password.reset.otp.expiration.minutes=5
password.expiration.days=90

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Give up on an unresponsive mail server after 10 s (JavaMail waits forever by default), so a request that sends
# an email never hangs.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
